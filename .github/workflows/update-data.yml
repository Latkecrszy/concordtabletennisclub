name: Update Data and Deploy

on:
  workflow_dispatch:
    inputs:
      full_refresh:
        description: "Full hard refresh: refetch and reparse every session (ignores the raw data cache)"
        type: boolean
        default: false
  schedule:
    # 11:30 PM Pacific, after Monday and Wednesday sessions. GitHub Actions
    # cron doesn't support timezones, so both possible UTC offsets are
    # scheduled (PDT and PST); the check-timing job below skips whichever
    # one doesn't actually land at 11pm Pacific once DST is accounted for.
    - cron: "30 6 * * 2,4"  # 11:30 PM PDT (UTC-7)
    - cron: "30 7 * * 2,4"  # 11:30 PM PST (UTC-8)
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  check-timing:
    # Only meaningful for scheduled runs, since both DST cron slots fire.
    # Manual (workflow_dispatch) and push-triggered runs always proceed.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - id: check
        run: |
          HOUR=$(TZ='America/Los_Angeles' date +%H)
          if [ "$HOUR" = "23" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "Skipping: current Pacific hour is $HOUR, not 23 (11 PM) — this cron slot doesn't match the current DST offset."
          fi

  update-and-deploy:
    needs: [check-timing]
    if: always() && (github.event_name != 'schedule' || needs.check-timing.outputs.proceed == 'true')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2

      - name: Set up Node
        uses: actions/setup-node@v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh session list
        run: npm run build:sessions

      - name: Refresh parsed data
        run: npm run build:data
        env:
          CTTC_FETCH_DELAY_MS: 250
          CTTC_FULL_REFRESH: ${{ github.event.inputs.full_refresh == 'true' }}

      - name: Send session summary email
        run: npm run email:send
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_SUBSCRIBERS: ${{ secrets.EMAIL_SUBSCRIBERS }}

      - name: Commit generated data
        run: |
          if [ -n "$(git status --porcelain data/sessions.json data/session-details-2024.json data/session-details-2025.json data/session-details-2026.json data/players.json .cache/session-raw-cache.json .cache/last-emailed-session.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/sessions.json data/session-details-2024.json data/session-details-2025.json data/session-details-2026.json data/players.json .cache/session-raw-cache.json .cache/last-emailed-session.json
            git commit -m "Update session data"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5.0.0

      - name: Prepare site artifact
        run: |
          mkdir -p _site
          cp .nojekyll CNAME _site/
          cp *.html style.css navtoggle.js favicon.svg _site/
          cp -R data _site/
          cp -R assets _site/

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4.0.5
